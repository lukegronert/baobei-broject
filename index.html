<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baobei Date Ideas</title>
  <meta name="description" content="Date ideas in Taipei and around Taiwan: activities, restaurants, places and events.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Baobei Date Ideas</h1>
    <p class="tagline">Things to do together in Taipei and around Taiwan</p>
    <div id="account" class="account" hidden>
      <button id="sign-in" class="link-button" type="button">Sign in</button>
      <form id="sign-in-form" class="sign-in-form" hidden>
        <input id="sign-in-email" type="email" required autocomplete="email" placeholder="Your email" aria-label="Email">
        <button type="submit">Email me a link</button>
      </form>
      <span id="signed-in" hidden>
        <span id="account-email"></span>
        <button id="sign-out" class="link-button" type="button">Sign out</button>
      </span>
      <p id="account-message" class="account-message" aria-live="polite" hidden></p>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="Filters">
      <div class="filter-row">
        <input id="search" type="search" placeholder="Search ideas, tags, areas…" aria-label="Search">
      </div>

      <div class="filter-row">
        <span class="filter-label">Type</span>
        <div class="chips" id="type-chips" role="group" aria-label="Type">
          <button class="chip active" data-value="all">All</button>
          <button class="chip" data-value="activity">Activities</button>
          <button class="chip" data-value="restaurant">Restaurants</button>
          <button class="chip" data-value="place">Places</button>
          <button class="chip" data-value="event">Events</button>
        </div>
      </div>

      <div class="filter-row selects">
        <label>City
          <select id="city">
            <option value="all">Everywhere</option>
          </select>
        </label>
        <label>Area
          <select id="area">
            <option value="all">All areas</option>
          </select>
        </label>
        <label>Price
          <select id="price">
            <option value="all">Any price</option>
            <option value="1">$</option>
            <option value="2">$$ or less</option>
            <option value="3">$$$ or less</option>
            <option value="4">$$$$ or less</option>
          </select>
        </label>
        <label>Status
          <select id="status">
            <option value="all">Everything</option>
            <option value="new">New</option>
            <option value="trending">Trending</option>
            <option value="classic">Classics</option>
          </select>
        </label>
        <label>Saved
          <select id="saved">
            <option value="all">Everything</option>
            <option value="favorites">Favorites</option>
            <option value="todo">Not done yet</option>
            <option value="done">Done</option>
            <option value="liked" disabled>Liked</option>
            <option value="disliked" disabled>Disliked</option>
          </select>
        </label>
        <label>Sort
          <select id="sort">
            <option value="featured">New &amp; trending first</option>
            <option value="recent">Recently added</option>
            <option value="soonest">Happening soonest</option>
            <option value="price">Price, low to high</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>

      <div class="filter-row summary">
        <span id="count" aria-live="polite"></span>
        <span class="summary-actions">
          <button id="surprise" class="surprise-button" type="button">🎲 Surprise me</button>
          <button id="reset" class="link-button" type="button">Reset filters</button>
        </span>
      </div>
    </section>

    <section id="today" class="today" aria-labelledby="today-title" hidden>
      <h2 id="today-title" class="section-title">New today</h2>
      <div id="today-cards" class="today-cards"></div>
    </section>

    <section id="cards" class="cards" aria-label="Date ideas"></section>
    <p id="empty" class="empty" hidden>No ideas match those filters yet.</p>
  </main>

  <footer class="site-footer">
    <p>Updated by a morning scout that looks for new openings, upcoming events and trending spots.</p>
  </footer>

  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <span class="type"></span>
        <span class="badges"></span>
        <span class="card-actions">
          <button class="toggle fav" type="button" aria-pressed="false" title="Favorite">♡</button>
          <button class="toggle done" type="button" aria-pressed="false" title="Mark as done">✓</button>
        </span>
      </div>
      <h2 class="name"></h2>
      <p class="meta"></p>
      <p class="dates" hidden></p>
      <p class="description"></p>
      <ul class="tags"></ul>
      <div class="card-bottom">
        <div class="links"></div>
        <span class="reactions" hidden>
          <button class="toggle like" type="button" aria-pressed="false" title="Like">👍</button>
          <button class="toggle dislike" type="button" aria-pressed="false" title="Dislike">👎</button>
        </span>
      </div>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="account.js"></script>
  <script src="app.js"></script>
</body>
</html>
